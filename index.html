<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0d16">
<title>InfoWallet — финансовый центр</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0b0c14;--surface:#141521;--surface2:#1c1c2d;
  --text:#f4f3ff;--muted:#a5a4bd;--line:rgba(186,173,255,.13);
  --purple:#a88aff;--accent:#8657ff;--pink:#ed8cda;
  --green:#65e1ba;--red:#ff8a9d;--gold:#ffd492;
  --shadow:0 18px 55px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;min-height:100vh;
}
body.light{
  color-scheme:light;--bg:#f2f0f9;--surface:#fff;--surface2:#eeeaf8;
  --text:#242035;--muted:#68627c;--line:rgba(68,45,110,.15);
  --purple:#7140ce;--accent:#7747dc;--green:#127b61;--red:#bf3455;
  --gold:#9a610e;--shadow:0 16px 50px rgba(50,25,95,.07);
}
body::before{
  content:"";position:fixed;z-index:-1;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 85% 0%,rgba(117,60,220,.16),transparent 48%),
    radial-gradient(ellipse at 5% 55%,rgba(50,86,183,.07),transparent 45%);
}
button,input,select,textarea{font:inherit}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button,a{touch-action:manipulation}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid var(--purple);outline-offset:3px;
}
button{color:inherit}
a{color:var(--purple)}
h1,h2,h3,p{margin:0}
h1{font-size:29px;letter-spacing:-1.1px;line-height:1.2}
h2{font-size:19px;letter-spacing:-.45px}
h3{font-size:16px}
small,.muted{color:var(--muted)}
small{font-size:12px}
button svg,a svg{pointer-events:none}
svg.icon{width:22px;height:22px;flex-shrink:0}
.layout{max-width:1440px;margin:auto;display:grid;grid-template-columns:235px 1fr;min-height:100vh}
.sidebar{
  padding:34px 22px;position:sticky;top:0;height:100vh;
  border-right:1px solid var(--line);display:flex;flex-direction:column;gap:28px;
}
.brand{display:flex;align-items:center;gap:11px;font-size:23px;font-weight:750;letter-spacing:-1px}
.logo{
  width:40px;height:40px;display:grid;place-items:center;border-radius:13px;
  background:linear-gradient(140deg,#b592ff,#6542de);color:white;
  box-shadow:0 4px 22px #8657ff33;font-size:23px;font-weight:800;
}
.side-nav{display:flex;flex-direction:column;gap:8px}
.navitem{
  border:0;background:none;display:flex;align-items:center;gap:13px;
  padding:13px 15px;border-radius:14px;color:var(--muted);text-align:left;
}
.navitem.active{background:linear-gradient(90deg,#8657ff28,#8657ff0b);color:var(--purple)}
.side-bottom{margin-top:auto;font-size:12px;color:var(--muted)}
.local-badge{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
.dot{width:6px;height:6px;background:var(--green);border-radius:50%;display:inline-block}
.main{padding:30px 38px 45px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:30px}
.topbar-title{display:flex;flex-direction:column;gap:5px}
.top-actions{display:flex;align-items:center;gap:10px}
.iconbtn{
  width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:14px;background:var(--surface);
}
.avatar{
  width:42px;height:42px;background:linear-gradient(135deg,#9b78ed,#e09db9);
  color:#fff;display:grid;place-items:center;border-radius:50%;font-weight:700;
}
.mobile-brand{display:none}
.page{animation:appear .28s ease}
@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:18px}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:repeat(3,1fr)}
.dashboard{grid-template-columns:1.13fr 1fr;align-items:start}
.stack{display:grid;gap:18px;min-width:0}
.card{
  border:1px solid var(--line);border-radius:23px;padding:23px;
  background:linear-gradient(135deg,rgba(147,116,228,.055),transparent 70%),var(--surface);
  box-shadow:var(--shadow);min-width:0;
}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.gap{margin-top:18px}
.balance-card{position:relative;overflow:hidden;padding:28px;background:linear-gradient(125deg,#453087,#25204c 60%,#1b1a33);color:#fff}
.balance-card::after{
  content:"";width:270px;height:270px;border:1px solid #ffffff12;
  border-radius:50%;position:absolute;right:-100px;top:-120px;
  box-shadow:0 0 0 35px #ffffff04,0 0 0 70px #ffffff03;pointer-events:none;
}
.balance-card .muted,.balance-card small{color:#cebee9}
.eyebrow{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.balance-number{font-size:clamp(29px,4vw,43px);font-weight:730;letter-spacing:-1.6px;margin:8px 0 20px;overflow-wrap:anywhere}
.balance-free{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid #ffffff20;padding-top:17px}
.balance-free strong{font-size:24px}
.quick{display:flex;gap:10px;margin-top:22px;position:relative;z-index:1}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:12px 17px;min-height:46px;border:1px solid var(--line);
  border-radius:14px;background:var(--surface2);font-weight:600;text-decoration:none;
  color:var(--text);transition:filter .18s,transform .18s;
}
.btn:hover{filter:brightness(1.1)}
.btn:active,.iconbtn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(120deg,#9568ff,#7146df);border-color:#ad8bff66;color:#fff;box-shadow:0 5px 25px #8657ff21}
.btn.pink{background:linear-gradient(115deg,#e99be2,#ffcf92);color:#272039;border:0}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);background:#ff668610}
.btn.small{padding:8px 12px;min-height:37px;font-size:12px;border-radius:11px}
.btn.full{width:100%}
.balance-card .btn.ghost{color:#fff;border-color:#ffffff33;background:#ffffff0a}
.link{background:none;border:0;color:var(--purple);padding:5px 0;font-size:13px;cursor:pointer}
.stat{padding:19px}
.stat .amount{font-size:23px;font-weight:700;letter-spacing:-.6px;margin-top:9px}
.stat-icon{width:35px;height:35px;border-radius:11px;display:grid;place-items:center;background:#65e1ba13;color:var(--green)}
.stat-icon.expense{background:#ff8a9d13;color:var(--red)}
.positive{color:var(--green)!important}.negative{color:var(--red)!important}
.money{font-variant-numeric:tabular-nums}
.badge{font-size:11px;padding:4px 9px;border-radius:9px;background:#a88aff17;color:var(--purple);white-space:nowrap}
.badge.warn{background:#ffd49216;color:var(--gold)}
.notice{padding:14px 16px;border-radius:14px;background:#a88aff0d;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.notice.warn{background:#ffb2550a;border-color:#ffd49230;color:var(--gold)}
.notice.danger{background:#ff8a9d0a;border-color:#ff8a9d30;color:var(--red)}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.transaction{display:flex;gap:13px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}
.transaction:last-child{border-bottom:0}
.tx-icon{
  width:44px;height:44px;display:grid;place-items:center;border-radius:15px;
  background:#a88aff12;border:1px solid #a88aff18;color:var(--purple);flex-shrink:0;
}
.tx-title{font-weight:600;overflow-wrap:anywhere}
.tx-meta{color:var(--muted);font-size:12px;margin-top:3px}
.tx-right{text-align:right;flex-shrink:0}
.tx-amount{font-size:14px;font-weight:650;white-space:nowrap}
.tx-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:4px}
.tx-actions button{background:none;border:0;padding:3px;font-size:11px;color:var(--muted)}
.tx-actions button:hover{color:var(--purple)}
.empty{text-align:center;padding:34px 18px;color:var(--muted)}
.empty .empty-icon{display:grid;place-items:center;width:54px;height:54px;border:1px solid var(--line);background:var(--surface2);border-radius:19px;margin:0 auto 15px;color:var(--purple)}
.empty p{font-size:13px;margin:8px 0 16px}
.chart{width:100%;height:165px;display:block;overflow:visible}
.chart-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:9px}
.chart-legend{display:flex;gap:16px;font-size:11px;color:var(--muted);flex-wrap:wrap;margin-top:12px}
.legend-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.progress{height:7px;border-radius:10px;background:var(--surface2);overflow:hidden;margin:15px 0 10px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#7850dd,#cf96ed);border-radius:10px}
.goal-card{position:relative}
.goal-icon{width:47px;height:47px;display:grid;place-items:center;background:#a88aff17;color:var(--purple);border-radius:16px}
.goal-numbers{font-size:23px;font-weight:700;margin-top:18px;letter-spacing:-.7px}
.goal-numbers small{font-size:13px;font-weight:400;letter-spacing:0}
.goal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:16px}
input,select,textarea{
  width:100%;border:1px solid var(--line);border-radius:12px;
  background:var(--bg);color:var(--text);padding:12px 13px;min-height:46px;outline:none;
}
textarea{resize:vertical;min-height:90px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
label.field{display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--muted);margin-bottom:16px}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.formrow label{min-width:0}
.check{display:flex;align-items:flex-start;gap:11px;font-size:13px;color:var(--muted);margin:13px 0}
.check input{width:18px;height:18px;min-height:0;flex-shrink:0;margin-top:2px;accent-color:var(--accent)}
.segment{display:flex;padding:4px;gap:4px;border:1px solid var(--line);border-radius:13px;background:var(--bg)}
.segment button{border:0;background:none;border-radius:9px;color:var(--muted);padding:9px 14px;flex:1;font-size:13px}
.segment button.active{background:var(--surface2);color:var(--text)}
.result-amount{font-size:36px;font-weight:750;letter-spacing:-1.2px}
.breakdown{display:grid;gap:12px;margin:20px 0}
.breakdown .row{font-size:13px}
.breakdown .row span{color:var(--muted)}
.scenario{padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.scenario strong{display:block;font-size:20px;margin:7px 0}
.event{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.datebox{width:46px;flex-shrink:0;text-align:center;border-radius:12px;padding:7px 3px;background:var(--surface2);font-weight:650;line-height:1.15}
.datebox small{font-weight:400;font-size:10px}
.donut{width:180px;height:180px;border-radius:50%;position:relative;display:grid;place-items:center;margin:20px auto}
.donut::before{content:"";position:absolute;inset:24px;background:var(--surface);border-radius:50%}
.donut div{position:relative;text-align:center}
.catline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;font-size:13px}
.author{
  display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:28px;
  padding:18px 20px;border:1px solid var(--line);border-radius:20px;background:#a88aff07;
}
.author strong{display:block;font-size:13px}
.author small{font-size:11px}
.author .btn{white-space:nowrap}
.bottom-nav{display:none}
.overlay{
  position:fixed;inset:0;z-index:100;background:rgba(4,5,12,.7);
  backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;
  padding:20px;animation:appear .17s ease;
}
.modal{
  width:100%;max-width:510px;background:var(--surface);border:1px solid var(--line);
  border-radius:25px;padding:25px;max-height:90dvh;overflow:auto;
  box-shadow:0 30px 100px #0007;
}
.modal.wide{max-width:670px}
.modalhead{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:23px}
.modalhead .iconbtn{width:34px;height:34px;border-radius:10px;flex-shrink:0}
.formerror{color:var(--red);font-size:13px;margin:12px 0;min-height:0}
.modalfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.toast{
  position:fixed;z-index:200;bottom:30px;left:50%;transform:translateX(-50%);
  background:var(--surface2);border:1px solid var(--line);box-shadow:0 8px 40px #0004;
  padding:13px 21px;border-radius:15px;max-width:90vw;font-size:13px;
}
.chatbox{min-height:240px;max-height:430px;overflow:auto;display:flex;flex-direction:column;gap:15px;padding:5px 0 20px}
.message{max-width:90%;padding:15px 17px;border-radius:17px;background:var(--surface2);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.message.user{align-self:flex-end;background:#8657ff27}
.message small{display:block;margin-bottom:5px;color:var(--purple)}
.settingrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 0;border-bottom:1px solid var(--line)}
.settingrow:last-child{border-bottom:0}
.settingrow p{font-size:13px;color:var(--muted);margin-top:3px}
.settingrow select{width:auto}
details{border:1px solid var(--line);border-radius:15px;padding:15px}
summary{cursor:pointer;font-size:14px}
details p,details li{font-size:13px;color:var(--muted);margin-top:10px}
.inline-note{font-size:12px;color:var(--muted);margin:10px 0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(min-width:1500px){.main{padding-top:44px}}
@media(max-width:1100px){
  .layout{grid-template-columns:200px 1fr}
  .sidebar{padding:28px 15px}.brand{font-size:20px}.main{padding:28px 23px}
  .dashboard{grid-template-columns:1fr}.three{grid-template-columns:1fr 1fr}
}
@media(max-width:720px){
  .layout{display:block}.sidebar{display:none}
  .main{padding:22px 17px calc(110px + env(safe-area-inset-bottom))}
  .mobile-brand{display:flex}.desktop-heading{display:none}
  .topbar{margin-bottom:25px}.brand{font-size:22px}.logo{width:35px;height:35px;border-radius:11px}
  h1{font-size:25px}.topbar-title small{font-size:11px}
  .grid{gap:13px}.stack{gap:15px}.card{padding:19px;border-radius:21px}
  .balance-card{padding:24px}.balance-number{font-size:37px}
  .balance-free strong{font-size:23px}.quick .btn{flex:1}
  .stat{padding:16px}.stat .amount{font-size:21px}
  .three{grid-template-columns:1fr}.two{gap:12px}
  .filters{grid-template-columns:1fr 1fr}.filters>:first-child{grid-column:1/-1}
  .author{flex-direction:column;text-align:center;gap:12px}
  .author .btn{width:100%}
  .bottom-nav{
    position:fixed;z-index:40;bottom:0;left:0;right:0;display:flex;
    align-items:center;justify-content:space-around;
    padding:11px 8px calc(10px + env(safe-area-inset-bottom));
    background:var(--surface);border-top:1px solid var(--line);
    box-shadow:0 -10px 40px #0001;
  }
  .bottom-nav button{
    display:flex;flex-direction:column;align-items:center;gap:5px;
    border:0;background:none;color:var(--muted);font-size:10px;padding:5px 9px;min-width:54px;
  }
  .bottom-nav button.active{color:var(--purple)}
  .bottom-nav .nav-add{
    width:53px;height:48px;border-radius:17px;
    background:linear-gradient(120deg,#ee9bdf,#ffd28f);color:#292038;margin-top:-24px;
    box-shadow:0 5px 25px #ed8cda27;min-width:0;padding:0;justify-content:center;
  }
  .bottom-nav .nav-add svg{width:25px;height:25px}
  .overlay{align-items:flex-end;padding:0}
  .modal{max-width:100%;border-radius:26px 26px 0 0;padding:24px 21px calc(25px + env(safe-area-inset-bottom));max-height:94dvh}
  .toast{bottom:105px}
  .sectionhead{align-items:flex-start}
}
@media(max-width:380px){
  .main{padding-left:12px;padding-right:12px}.balance-number{font-size:32px}
  .formrow{grid-template-columns:1fr;gap:0}.tx-icon{width:37px;height:37px}
  .transaction{gap:9px}.tx-amount{font-size:12px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><div class="logo">V</div>InfoWallet</div>
    <div class="side-nav" id="sideNav"></div>
    <div class="side-bottom">
      <div class="local-badge"><i class="dot"></i> Локальное хранилище</div>
      <p style="margin-top:12px">Деньги под контролем.<br>Решения — за вами.</p>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <div class="brand mobile-brand"><div class="logo">V</div>InfoWallet</div>
        <h1 class="desktop-heading" id="desktopTitle">Обзор финансов</h1>
        <small id="headerDate"></small>
      </div>
      <div class="top-actions">
        <button class="iconbtn" onclick="go('chat')" aria-label="Открыть финансового помощника" title="Финансовый помощник" id="chatTop"></button>
        <button class="avatar" style="border:0" onclick="go('settings')" aria-label="Открыть настройки" id="avatar">Л</button>
      </div>
    </header>
    <div id="app"></div>
    <footer class="author">
      <div><strong>Автор проекта — @salfitka_5</strong><small>InfoWallet · личный финансовый центр</small></div>
      <a class="btn primary" href="https://t.me/salfitka_5" target="_blank" rel="noopener noreferrer">
        Связаться с автором ↗
      </a>
    </footer>
  </main>
</div>
<nav class="bottom-nav" id="bottomNav" aria-label="Основная навигация"></nav>
<div id="modalRoot"></div>
<div id="toastRoot" aria-live="polite"></div>
<script>
"use strict";

/* Все суммы в состоянии — целые копейки.
   Пополнение цели — распределение внутри баланса, не внешний расход.
   Будущие операции не входят в текущий баланс.
   Прогноз — только записанные события, без выдуманных доходов. */

const STORE="infowallet-local-v1";
const MAX=1000000000000;
const DAY=86400000;
const palette=["#aa85ff","#ed9ad8","#73d9c4","#f4c886","#799cf4","#caabef","#f18f9c","#a8c878"];
const categories=["Продукты","Транспорт","Жильё","Кафе","Покупки","Здоровье","Развлечения","Образование","Подписки","Зарплата","Подработка","Другое"];
const paths={
  home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>',
  wallet:'<path d="M20 8V5a2 2 0 0 0-2-2H5a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h15V8H5a2 2 0 0 1 0-4"/><path d="M20 12h-5v5h5"/><path d="M16 14.5h.01"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  ai:'<path d="m12 3 2.4 6.6L21 12l-6.6 2.4L12 21l-2.4-6.6L3 12l6.6-2.4Z"/>',
  arrow:'<path d="M6 18 18 6M6 6h12v12"/>',
  down:'<path d="M6 6 18 18M6 18h12V6"/>',
  close:'<path d="m6 6 12 12M18 6 6 18"/>',
  radar:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="m12 12 7-7M12 3v2M3 12h2M12 19v2M19 12h2"/>',

function validateState(s){
  if(!s||s.version!==1||!isAmount(s.opening)||!isAmount(s.reserve))throw Error("Некорректный формат данных.");
  for(const key of ["transactions","goals","budgets","recurring","rules","reminders","chat"]){
    if(!Array.isArray(s[key])||s[key].length>20000)throw Error("Некорректный список: "+key);
  }
  const ids=new Set();
  function checkId(x){
    if(typeof x.id!=="string"||!/^[a-zA-Z0-9_-]{1,100}$/.test(x.id)||ids.has(x.id))throw Error("Некорректные идентификаторы.");
    ids.add(x.id);
  }
  for(const g of s.goals){
    checkId(g);
    if(!isAmount(g.current)||!isAmount(g.target)||g.target===0||typeof g.title!=="string"||g.title.length>160||(g.deadline&&!validDate(g.deadline)))throw Error("Некорректная цель.");
  }
  const goalIds=new Set(s.goals.map(g=>g.id));
  for(const t of s.transactions){
    checkId(t);
    if(!["income","expense"].includes(t.type)||!isAmount(t.amount)||!t.amount||!validDate(t.date)||typeof t.category!=="string"||typeof t.note!=="string")throw Error("Некорректная операция.");
    if(!Array.isArray(t.allocations))throw Error("Некорректные распределения.");
    for(const a of t.allocations)if(!goalIds.has(a.goalId)||!isAmount(a.amount))throw Error("Некорректное распределение.");
    if(t.recurringId&&(!s.recurring.some(r=>r.id===t.recurringId)||!validDate(t.due)))throw Error("Некорректная связь платежа.");
  }
  const occurrenceKeys=s.transactions.filter(t=>t.recurringId).map(t=>t.recurringId+"|"+t.due);
  if(new Set(occurrenceKeys).size!==occurrenceKeys.length)throw Error("Повторное исполнение регулярного платежа.");
  for(const b of s.budgets){
    checkId(b);
    if(typeof b.category!=="string"||!isAmount(b.limit)||b.limit===0||!["month","week"].includes(b.period))throw Error("Некорректный бюджет.");
  }
  for(const r of s.recurring){
    checkId(r);
    if(!["income","expense"].includes(r.type)||!isAmount(r.amount)||!r.amount||!validDate(r.next)||!["weekly","monthly","yearly"].includes(r.period)||typeof r.title!=="string")throw Error("Некорректный регулярный платёж.");
  }
  for(const r of s.rules){
    checkId(r);
    if(!Number.isInteger(r.percent)||r.percent<0||r.percent>10000||(r.goalId!=="reserve"&&!goalIds.has(r.goalId)))throw Error("Некорректное правило.");
  }
  if(s.rules.reduce((n,r)=>n+(r.active?r.percent:0),0)>10000)throw Error("Сумма правил превышает 100%.");
  if(!s.rounding||!isAmount(s.rounding.step)||s.rounding.step<100||(s.rounding.enabled&&!goalIds.has(s.rounding.goalId)))throw Error("Некорректное округление.");
  if(typeof s.name!=="string"||s.name.length>80||!["dark","light"].includes(s.theme))throw Error("Некорректные настройки.");
  for(const m of s.chat)if(!m||!["user","assistant"].includes(m.role)||typeof m.content!=="string"||m.content.length>12000)throw Error("Некорректный чат.");
  for(const r of s.reminders)if(!r||typeof r.title!=="string"||!validDate(r.date)||!isAmount(r.amount))throw Error("Некорректное напоминание.");
  return s;
}

function balanceAt(s,date=today()){
  return s.opening+s.transactions.filter(t=>t.date<=date).reduce((n,t)=>n+(t.type==="income"?t.amount:-t.amount),0);
}
function protectedTotal(s){
  return s.reserve+s.goals.reduce((n,g)=>n+g.current,0);
}
function allocationTotal(s){return s.goals.reduce((n,g)=>n+g.current,0)}
function monthStart(date=today()){return date.slice(0,7)+"-01"}
function weekStart(date=today()){
  const d=new Date(date+"T00:00:00Z").getUTCDay();return addDays(date,-((d+6)%7));
}
function totals(s,start=monthStart(),end=today()){
  const list=s.transactions.filter(t=>t.date>=start&&t.date<=end);
  return {income:list.filter(t=>t.type==="income").reduce((n,t)=>n+t.amount,0),
    expense:list.filter(t=>t.type==="expense").reduce((n,t)=>n+t.amount,0)};
}
function recurringDate(r,n){
  if(r.period==="weekly")return addDays(r.next,n*7);
  const [y,m,d]=r.next.split("-").map(Number);
  const month=(m-1)+(r.period==="monthly"?n:n*12);
  const base=new Date(Date.UTC(y,month,1));
  const last=new Date(Date.UTC(base.getUTCFullYear(),base.getUTCMonth()+1,0)).getUTCDate();
  return dateISO(Date.UTC(base.getUTCFullYear(),base.getUTCMonth(),Math.min(d,last)));
}
function eventsUntil(s,end){
  const now=today(),events=[];
  const booked=new Set(s.transactions.filter(t=>t.recurringId).map(t=>t.recurringId+"|"+t.due));
  for(const t of s.transactions){
    if(t.date>now&&t.date<=end)events.push({
      id:t.id,date:t.date,due:t.date,type:t.type,amount:t.amount,
      title:t.note||t.category,source:"planned",transactionId:t.id
    });
  }
  for(const r of s.recurring){
    if(!r.active)continue;
    for(let n=0;n<6000;n++){
      const due=recurringDate(r,n);
      if(due>end)break;
      if(booked.has(r.id+"|"+due))continue;
      events.push({
        id:r.id+"_"+due,date:due<now?now:due,due,
        type:r.type,amount:r.amount,title:r.title,
        source:"recurring",recurringId:r.id,overdue:due<now
      });
    }
  }
  return events.sort((a,b)=>a.date.localeCompare(b.date)||(a.type===b.type?0:a.type==="expense"?-1:1));
}
function freeInfo(s,at=today()){
  const now=today();
  const end=addDays(at,366);
  const events=eventsUntil(s,end);
  let b=balanceAt(s,now);
  if(at>now){
    for(const e of events)if(e.date<=at)b+=e.type==="income"?e.amount:-e.amount;
  }
  const relevant=events.filter(e=>at===now?e.date>=at:e.date>at);
  const income=relevant.find(e=>e.type==="income");
  const horizon=income?income.date:addDays(at,30);
  const obligations=relevant.filter(e=>e.type==="expense"&&e.date<=horizon).reduce((n,e)=>n+e.amount,0);
  const goals=allocationTotal(s),locked=s.reserve+goals;
  return {balance:b,reserve:s.reserve,goals,obligations,free:b-locked-obligations,horizon,nextIncome:income||null,locked};
}
function forecast(s,days=30,purchase=null){
  const now=today(),end=addDays(now,days);
  const events=eventsUntil(s,end);
  let b=balanceAt(s),points=[{date:now,balance:b}];
  let firstCash=null,firstProtected=null;
  const floor=protectedTotal(s);
  function check(date){
    if(b<0&&!firstCash)firstCash={date,amount:-b};
    if(b<floor&&!firstProtected)firstProtected={date,amount:floor-b};
  }
  if(purchase&&purchase.date===now)b-=purchase.amount;
  check(now);
  for(let i=0;i<=days;i++){
    const date=addDays(now,i);
    if(i>0&&purchase&&purchase.date===date){b-=purchase.amount;check(date)}
    for(const e of events.filter(e=>e.date===date)){
      b+=e.type==="income"?e.amount:-e.amount;check(date);
    }
    if(i===0)points[0]={date,balance:b};else points.push({date,balance:b});
  }
  return {points,events,firstCash,firstProtected,floor};
}
function goalMonthly(g){
  const remaining=Math.max(0,g.target-g.current);
  if(!g.deadline||!remaining)return 0;
  const days=Math.max(1,daysBetween(today(),g.deadline));
  const months=Math.max(1,Math.ceil(days/30.4375));
  return Math.ceil(remaining/months);
}

function bindFilters(){
  for(const [id,key] of [["filterSearch","search"],["filterType","type"],["filterCategory","category"],["filterFrom","from"],["filterTo","to"]]){

function expenseCategories(start=monthStart(),end=today()){

  state.transactions.filter(t=>t.type==="expense"&&t.date>=start&&t.date<=end).forEach(t=>map[t.category]=(map[t.category]||0)+t.amount);
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}

}

function calculateSimulation(e){
  e.preventDefault();const d=new FormData(e.target);
  try{
    const date=d.get("date");
    if(!validDate(date)||date<today()||date>addDays(today(),90))throw Error("Выберите дату в ближайшие 90 дней.");
    simulation={title:String(d.get("title")).trim(),amount:parseMoney(d.get("amount")),date};
    render();
  }catch(err){document.getElementById("simError").textContent=err.message}
}
function saveSimulation(){
  if(!simulation)return;

}
function remindSimulation(){

}

function localAnswer(text){
  const q=text.toLowerCase(),f=freeInfo(state),t=totals(state),cats=expenseCategories();
  if(/цел|копил|накоп/.test(q)){
    return state.goals.length?state.goals.map(g=>`${g.title}: ${money(g.current)} из ${money(g.target)}.${g.deadline?" Рекомендуемый взнос: "+money(goalMonthly(g))+"/мес.":""}`).join("\n"):"Целей пока нет. Создайте цель и распределите в неё часть свободных средств.";
  }
  if(/дефицит|риск|хват|радар|прогноз/.test(q)){
    const fc=forecast(state,30);
    return fc.firstCash?`По записанным событиям возможен кассовый разрыв ${longDate(fc.firstCash.date)}: ${money(fc.firstCash.amount)}. Проверьте ближайшие расходы и сроки доходов.`:fc.firstProtected?`Общий баланс не становится отрицательным, но ${longDate(fc.firstProtected.date)} может опуститься ниже суммы резерва и целей на ${money(fc.firstProtected.amount)}.`:"В прогнозе на 30 дней не обнаружен дефицит относительно резерва и целей. Это верно только для записанных событий: незапланированные траты не учтены.";
  }
  if(/трат|расход|категор|бюджет|лимит/.test(q)){
    const over=state.budgets.filter(b=>budgetSpent(b)>b.limit);
    return `Расходы текущего месяца: ${money(t.expense)}.\n${cats.length?"Крупнейшие категории:\n"+cats.slice(0,5).map(([c,v])=>`${c}: ${money(v)}`).join("\n"):"Расходов пока нет."}${over.length?"\nПревышены лимиты: "+over.map(b=>b.category+" на "+money(budgetSpent(b)-b.limit)).join("; ")+".":""}\nДля изменения лимитов откройте «Аналитика → Бюджеты». Автоматически ничего не меняю.`;
  }
  if(/свобод|баланс|денег|остат|доход/.test(q)){
    return `Баланс: ${money(f.balance)}.\nРезерв: ${money(f.reserve)}.\nВ целях: ${money(f.goals)}.\nБлижайшие обязательства: ${money(f.obligations)} до ${longDate(f.horizon)}.\nСвободно: ${money(f.free)}.\nДоходы текущего месяца: ${money(t.income)}.\nОжидаемые доходы не добавляются к доступным деньгам сегодня.`;
  }
  return "Я работаю по локальным правилам, без внешней нейросети. Могу показать свободный остаток, расходы по категориям, прогресс целей и риск дефицита. Для проверки покупки откройте симулятор.";
}

function openModal(title,body,onSubmit=null,wide=false){
  closeModal(false);lastFocus=document.activeElement;
  const root=document.getElementById("modalRoot");
  root.innerHTML=`<div class="overlay" id="modalOverlay"><div class="modal ${wide?"wide":""}" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1"><div class="modalhead"><h2 id="modalTitle">${esc(title)}</h2><button class="iconbtn" type="button" onclick="closeModal()" aria-label="Закрыть">${icon("close")}</button></div>${onSubmit?'<form id="modalForm">':""}${body}${onSubmit?'<div class="formerror" id="modalError" role="alert"></div><div class="modalfoot"><button class="btn ghost" type="button" onclick="closeModal()">Отмена</button><button class="btn primary" type="submit">Подтвердить и сохранить</button></div></form>':""}</div></div>`;
  document.body.style.overflow="hidden";
  const box=root.querySelector(".modal");
  root.querySelector(".overlay").addEventListener("click",e=>{if(e.target.id==="modalOverlay")closeModal()});
  const key=e=>{
    if(e.key==="Escape")closeModal();
    if(e.key==="Tab"){
      const els=[...box.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href]')].filter(el=>el.offsetParent!==null);
      if(!els.length){e.preventDefault();box.focus();return}
      const first=els[0],last=els[els.length-1];
      if(e.shiftKey&&(document.activeElement===first||!box.contains(document.activeElement))){e.preventDefault();last.focus()}
      else if(!e.shiftKey&&(document.activeElement===last||!box.contains(document.activeElement))){e.preventDefault();first.focus()}
    }
  };
  document.addEventListener("keydown",key);modalCleanup=()=>document.removeEventListener("keydown",key);
  if(onSubmit){
    document.getElementById("modalForm").onsubmit=e=>{
      e.preventDefault();
      try{onSubmit(new FormData(e.target));closeModal()}
      catch(err){const out=document.getElementById("modalError");if(out)out.textContent=err.message;else toast(err.message)}
    };
  }
  setTimeout(()=>{(box.querySelector("input,select,textarea")||box.querySelector("button")||box).focus()},30);
}
function closeModal(restore=true){
  if(modalCleanup){modalCleanup();modalCleanup=null}
  document.getElementById("modalRoot").innerHTML="";
  document.body.style.overflow="";
  if(restore&&lastFocus?.isConnected)lastFocus.focus();
}

function removeTransactionEffects(s,t){
  for(const a of t.allocations||[]){
    const g=s.goals.find(g=>g.id===a.goalId);
    if(!g||g.current<a.amount)throw Error("Нельзя изменить операцию: связанные средства уже изъяты из цели. Сначала верните их в копилку.");
    g.current-=a.amount;
  }
  if(t.reserveAllocation){
    if(s.reserve<t.reserveAllocation)throw Error("Сначала восстановите связанное распределение в резерве.");
    s.reserve-=t.reserveAllocation;
  }
}
function applyTransactionEffects(s,t){
  t.allocations=[];t.reserveAllocation=0;t.automationSkipped="";
  if(t.date>today())return;
  let allocations=[],reserveAllocation=0;
  if(t.type==="income"){
    for(const r of s.rules.filter(r=>r.active)){
      const amount=Math.floor(t.amount*r.percent/10000);
      if(!amount)continue;
      if(r.goalId==="reserve")reserveAllocation+=amount;
      else if(s.goals.some(g=>g.id===r.goalId))allocations.push({goalId:r.goalId,amount});
    }
  }else if(s.rounding.enabled){
    const amount=(s.rounding.step-t.amount%s.rounding.step)%s.rounding.step;
    if(amount&&s.goals.some(g=>g.id===s.rounding.goalId))allocations.push({goalId:s.rounding.goalId,amount});
  }
  const sum=reserveAllocation+allocations.reduce((n,a)=>n+a.amount,0);
  if(sum>Math.max(0,freeInfo(s).free)){
    t.automationSkipped="Автораспределение пропущено: недостаточно свободных средств.";
    return;
  }
  for(const a of allocations)s.goals.find(g=>g.id===a.goalId).current+=a.amount;
  s.reserve+=reserveAllocation;t.allocations=allocations;t.reserveAllocation=reserveAllocation;
}
function transactionModal(id="",defaultType="expense",prefill={}){

  const body=selectField("Тип операции","type",[["expense","Расход"],["income","Доход"]],t.type)+
    field("Сумма, ₽","amount",t.amount?raw(t.amount):"","text",'inputmode="decimal" required placeholder="0"')+
    selectField("Категория","category",allCategories().map(c=>[c,c]),t.category)+
    field("Дата","date",t.date,"date",'min="2000-01-01" max="2100-12-31" required')+

    `<div class="notice">Нажатие «Подтвердить и сохранить» изменит ваши данные.${existing?" При редактировании связанные автоматические распределения будут отменены и рассчитаны заново по текущим правилам.":""} Будущие операции учитываются в прогнозе, а не в текущем балансе.</div>`;
  openModal(existing?"Изменить операцию":"Добавить операцию",body,d=>{
    const date=d.get("date");if(!validDate(date))throw Error("Некорректная дата.");
    const type=String(d.get("type"));

      const r=state.recurring.find(r=>r.id===existing.recurringId);
      if(r&&r.type!==type)throw Error("Тип исполненного регулярного платежа менять нельзя.");
    }
    let skipped="";
    transact(n=>{
      if(existing){const old=n.transactions.find(t=>t.id===id);removeTransactionEffects(n,old);n.transactions=n.transactions.filter(t=>t.id!==id)}
      const tx={
        id:existing?.id||uid(),type,amount:parseMoney(d.get("amount")),
        category:String(d.get("category")),date,note:String(d.get("note")).trim(),
        allocations:[],reserveAllocation:0,
        recurringId:existing?.recurringId||prefill.recurringId||"",
        due:existing?.due||prefill.due||""
      };
      if(tx.recurringId&&n.transactions.some(t=>t.recurringId===tx.recurringId&&t.due===tx.due))throw Error("Это событие уже исполнено.");
      n.transactions.push(tx);applyTransactionEffects(n,tx);skipped=tx.automationSkipped;
    },skipped||"Операция сохранена");
    if(skipped)setTimeout(()=>toast(skipped),100);
  });
}

    (b?`<button type="button" class="btn danger small" onclick="deleteBudget('${id}')">Удалить бюджет</button>`:""),
    d=>transact(n=>{
      const category=String(d.get("category")),period=String(d.get("period"));
      if(n.budgets.some(x=>x.id!==id&&x.category===category&&x.period===period))throw Error("Такой бюджет уже существует.");
      const obj={id:b?.id||uid(),category,period,limit:parseMoney(d.get("limit"))};
      if(b)n.budgets[n.budgets.findIndex(x=>x.id===id)]=obj;else n.budgets.push(obj);
    },"Бюджет сохранён"));

function deleteBudget(id){
  confirmModal("Удалить бюджет?","История операций останется без изменений.",()=>transact(n=>n.budgets=n.budgets.filter(b=>b.id!==id),"Бюджет удалён"),"Удалить");

function periodLabel(p){return {weekly:"Каждую неделю",monthly:"Каждый месяц",yearly:"Каждый год"}[p]}
function recurringModal(id=""){
  const r=state.recurring.find(r=>r.id===id);
  openModal(r?"Изменить регулярное событие":"Регулярный доход или расход",
    field("Название","title",r?.title||"","text",'required maxlength="160" placeholder="Аренда, зарплата, интернет…"')+
    selectField("Тип","type",[["expense","Обязательный расход"],["income","Ожидаемый доход"]],r?.type||"expense")+
    field("Сумма, ₽","amount",r?raw(r.amount):"","text",'inputmode="decimal" required')+
    selectField("Частота","period",[["monthly","Ежемесячно"],["weekly","Еженедельно"],["yearly","Ежегодно"]],r?.period||"monthly")+
    field("Первая учитываемая дата","next",r?.next||today(),"date",'min="2000-01-01" max="2100-12-31" required')+
    `<label class="check"><input type="checkbox" name="active" ${!r||r.active?"checked":""}>Учитывать в прогнозе</label>`+
    '<div class="notice">Для ежемесячных событий сохраняем исходное число месяца: после 31 января будет последний день февраля, затем 31 марта.</div>'+
    (r?`<button type="button" class="btn danger small gap" onclick="deleteRecurring('${id}')">Удалить расписание</button>`:""),
    d=>{
      const title=String(d.get("title")).trim(),next=d.get("next");
      if(!title)throw Error("Введите название.");if(!validDate(next))throw Error("Проверьте дату.");
      transact(n=>{
        const obj={id:r?.id||uid(),title,type:String(d.get("type")),amount:parseMoney(d.get("amount")),period:String(d.get("period")),next,active:d.has("active")};
        if(r&&n.transactions.some(t=>t.recurringId===id)&&obj.type!==r.type)throw Error("У расписания уже есть исполненные операции. Для другого типа создайте новое.");
        if(r)n.recurring[n.recurring.findIndex(x=>x.id===id)]=obj;else n.recurring.push(obj);
      },"Расписание сохранено");
    });
}
function deleteRecurring(id){
  confirmModal("Удалить расписание?","Уже сохранённые операции останутся, но перестанут быть связаны с расписанием.",()=>{
    transact(n=>{
      n.recurring=n.recurring.filter(r=>r.id!==id);
      n.transactions.forEach(t=>{if(t.recurringId===id){t.recurringId="";t.due=""}});
    },"Расписание удалено");
  },"Удалить");
}
function payRecurring(id,due){
  const r=state.recurring.find(r=>r.id===id);if(!r)return;
  if(state.transactions.some(t=>t.recurringId===id&&t.due===due)){toast("Событие уже исполнено");return}
  transactionModal("",r.type,{amount:r.amount,note:r.title,date:today(),category:r.type==="income"?"Зарплата":"Подписки",recurringId:id,due});
}
function ruleModal(){
  openModal("Автораспределение дохода",
    field("Процент каждого дохода","percent","20","text",'inputmode="decimal" required')+
    selectField("Куда распределять","goalId",[["reserve","Защитный резерв"],...state.goals.map(g=>[g.id,g.title])],"reserve")+
    '<div class="notice">Правило применяется только при сохранении нового или изменённого проведённого дохода. История задним числом не пересчитывается без редактирования. Сумма активных долей не должна превышать 100%.</div>',
    d=>transact(n=>{
      const percent=parsePercent(d.get("percent"));if(!percent)throw Error("Укажите процент больше нуля.");
      if(n.rules.filter(r=>r.active).reduce((v,r)=>v+r.percent,0)+percent>10000)throw Error("Сумма долей превышает 100%.");
      n.rules.push({id:uid(),percent,goalId:String(d.get("goalId")),active:true});
    },"Правило добавлено"));
}
function deleteRule(id){
  confirmModal("Удалить правило?","Уже выполненные распределения останутся без изменений.",()=>transact(n=>n.rules=n.rules.filter(r=>r.id!==id),"Правило удалено"),"Удалить");
}
function roundingModal(){
  if(!state.goals.length){
    confirmModal("Сначала создайте цель","Для округления нужна копилка, в которую будет распределяться сдача.",()=>goalModal(),"Создать цель");return;
  }
  openModal("Округление покупок",
    `<label class="check"><input type="checkbox" name="enabled" ${state.rounding.enabled?"checked":""}>Включить для новых проведённых расходов</label>`+
    selectField("Шаг округления","step",[[1000,"До 10 ₽"],[5000,"До 50 ₽"],[10000,"До 100 ₽"],[50000,"До 500 ₽"]],state.rounding.step)+
    selectField("Копилка для сдачи","goalId",state.goals.map(g=>[g.id,g.title]),state.rounding.goalId||state.goals[0].id)+
    '<div class="notice">Пример: расход 1 477 ₽, шаг 100 ₽. Из общего баланса вычитается 1 477 ₽; ещё 23 ₽ внутри оставшегося баланса защищаются целью. Если свободных средств недостаточно, распределение пропускается.</div>',
    d=>transact(n=>{n.rounding={enabled:d.has("enabled"),step:Number(d.get("step")),goalId:String(d.get("goalId"))}},"Округление настроено"));
}
function changeTheme(theme){
  try{transact(n=>n.theme=theme)}catch(err){toast(err.message)}
}
function deleteReminder(index){
  confirmModal("Убрать напоминание?","Операция расхода не будет создана.",()=>transact(n=>n.reminders.splice(index,1),"Напоминание удалено"),"Убрать");
}
function download(name,text,type){
  const blob=new Blob([text],{type}),url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=name;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportBackup(){
  download("InfoWallet-"+today()+".json",JSON.stringify(state,null,2),"application/json");
  toast("Резервная копия подготовлена");
}
function exportCSV(){
  const safe=v=>{
    let s=String(v??"");
    if(/^[=+\-@\t\r]/.test(s))s="'"+s;
    return '"'+s.replace(/"/g,'""')+'"';
  };
  const rows=[["ID","Тип","Сумма RUB","Категория","Дата","Комментарий","Статус"],
    ...state.transactions.map(t=>[t.id,t.type==="income"?"Доход":"Расход",raw(t.amount).replace(".",","),t.category,t.date,t.note,t.date>today()?"Запланировано":"Проведено"])];
  download("InfoWallet-операции-"+today()+".csv","\uFEFF"+rows.map(r=>r.map(safe).join(";")).join("\r\n"),"text/csv;charset=utf-8");
}
async function importBackup(input){
  const file=input.files[0];input.value="";if(!file)return;
  if(file.size>8*1024*1024){toast("Файл больше 8 МБ");return}
  try{
    const next=validateState(JSON.parse(await file.text()));
    confirmModal("Заменить локальные данные?",`Будет восстановлено ${next.transactions.length} операций и ${next.goals.length} целей. Текущие данные будут заменены.`,()=>{
      commit(next,"Резервная копия восстановлена");simulation=null;render();
    },"Заменить данные");
  }catch(err){toast("Не удалось прочитать копию: "+err.message)}
}
function resetAll(){
  openModal("Полное удаление",
    '<div class="notice danger">Удалятся операции, цели, настройки, бюджеты и история помощника. Действие необратимо без резервной копии.</div>'+
    field("Для подтверждения введите УДАЛИТЬ","confirmation","","text",'required autocomplete="off"'),
    d=>{
      if(String(d.get("confirmation")).trim()!=="УДАЛИТЬ")throw Error("Введите УДАЛИТЬ заглавными буквами.");
      commit(fresh(),"Локальные данные удалены");simulation=null;page="home";render();
    });
}
function runTests(){
  const tests=[];
  function test(name,fn){
    try{if(fn()!==true)throw Error("результат не совпал");tests.push({name,ok:true})}
    catch(e){tests.push({name,ok:false,error:e.message})}
  }
  test("Деньги: 0,01 ₽ = 1 копейка",()=>parseMoney("0,01")===1);
  test("Свободно: 24 800 − 12 000 − 6 400 = 6 400 ₽",()=>{
    const s=fresh();s.opening=2480000;s.reserve=1200000;s.goals=[{id:"g",title:"Тест",target:640000,current:640000,deadline:""}];
    return freeInfo(s).free===640000;
  });
  test("Покупка 4 500 ₽ оставляет 1 900 ₽",()=>{
    const s=fresh();s.opening=2480000;s.reserve=1200000;s.goals=[{id:"g",title:"Тест",target:640000,current:640000,deadline:""}];
    return freeInfo(s).free-450000===190000;
  });
  test("Обязательство 2 200 ₽ даёт дефицит 300 ₽",()=>{
    const s=fresh();s.opening=2480000;s.reserve=1200000;s.goals=[{id:"g",title:"Тест",target:640000,current:640000,deadline:""}];
    s.recurring=[{id:"r",title:"Счёт",amount:220000,type:"expense",period:"monthly",next:addDays(today(),3),active:true}];
    return freeInfo(s).free-450000===-30000;
  });
  test("Пополнение цели не уменьшает общий баланс",()=>{
    const s=fresh();s.opening=100000;s.goals=[{id:"g",title:"Тест",target:50000,current:20000,deadline:""}];
    return balanceAt(s)===100000&&freeInfo(s).free===80000;
  });
  test("Исполненный регулярный платёж не вычитается повторно",()=>{
    const s=fresh();s.opening=100000;
    s.recurring=[{id:"r",title:"Счёт",amount:20000,type:"expense",period:"monthly",next:today(),active:true}];
    s.transactions=[{id:"t",amount:20000,type:"expense",date:today(),category:"Другое",note:"",allocations:[],recurringId:"r",due:today()}];
    return balanceAt(s)===80000&&!eventsUntil(s,today()).some(e=>e.recurringId==="r");
  });
  test("Будущий доход не входит в свободные деньги сегодня",()=>{
    const s=fresh();s.transactions=[{id:"t",amount:100000,type:"income",date:addDays(today(),5),category:"Зарплата",note:"",allocations:[]}];
    return freeInfo(s).free===0;
  });
  test("31 января → 28 февраля → 31 марта",()=>{
    const r={next:"2027-01-31",period:"monthly"};
    return recurringDate(r,1)==="2027-02-28"&&recurringDate(r,2)==="2027-03-31";
  });
  test("Округление 1 477 ₽: расход 1 477 ₽ + распределение 23 ₽",()=>{
    const s=fresh();s.opening=1000000;
    s.goals=[{id:"g",title:"Сдача",target:100000,current:0,deadline:""}];
    s.rounding={enabled:true,step:10000,goalId:"g"};
    const t={id:"t",type:"expense",amount:147700,date:today(),category:"Покупки",note:"",allocations:[]};
    s.transactions.push(t);applyTransactionEffects(s,t);
    return balanceAt(s)===852300&&s.goals[0].current===2300;
  });
  test("Ровно хватает: свободный остаток равен нулю",()=>{
    const s=fresh();s.opening=10000;s.reserve=10000;return freeInfo(s).free===0;
  });
  openModal("Проверка финансовых расчётов",
    `<div class="notice">${tests.filter(t=>t.ok).length} из ${tests.length} тестов пройдено. Это локальные проверки функций, не интеграционные тесты Supabase или браузерный E2E.</div><div class="gap">${tests.map(t=>`<div class="settingrow"><span style="font-size:13px">${esc(t.name)}${t.error?" · "+esc(t.error):""}</span><strong class="${t.ok?"positive":"negative"}">${t.ok?"✓":"✕"}</strong></div>`).join("")}</div>`,null,true);
}

/* Будущая операция становится проведённой по календарной дате.
   Автоматические распределения для неё не выполняются скрыто.
   Пользователь может открыть и подтвердить операцию повторно. */
let lastRenderedDay=today();
setInterval(()=>{
  if(today()!==lastRenderedDay){lastRenderedDay=today();simulation=null;render()}
},30000);
window.addEventListener("storage",e=>{
  if(e.key!==STORE)return;
  if(!e.newValue){
    toast("Хранилище изменено в другой вкладке. Обновите страницу.");
    return;
  }
  try{
    const next=validateState(JSON.parse(e.newValue));
    closeModal();state=next;simulation=null;render();toast("Данные обновлены из другой вкладки");
  }catch(err){toast("Из другой вкладки получены некорректные данные. Изменения не применены.")}
});
render();
if(storageIssue){
  setTimeout(()=>openModal("Не удалось загрузить сохранение",
    '<div class="notice danger">Хранилище недоступно или сохранённые данные повреждены. Приложение показало пустое состояние и пока не перезаписывало старые данные. Перед сохранением новых операций проверьте резервную копию.</div>'),100);
}else if(!state.name&&!state.opening&&!state.transactions.length){
  setTimeout(()=>openModal("Добро пожаловать в InfoWallet",
    `<div class="row" style="margin-bottom:18px"><div class="logo">V</div><div><h3>Больше ясности в финансах</h3><small>Без выдуманных балансов и операций</small></div></div>
    <p class="muted">Начните с имени и начального баланса. Затем добавьте резерв, цели и регулярные платежи — свободный остаток и прогноз рассчитаются автоматически.</p>
    <div class="notice gap">Это локальная версия. Данные хранятся в этом браузере, без облачного аккаунта. Регулярно сохраняйте резервную копию.</div>
    <div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Позже</button><button class="btn primary" onclick="accountModal()">Начать настройку</button></div>`),180);
}
</script>

<script>
"use strict";

/*

  Оригинальные операции, цели, платежи, правила, помощник,
  экспорт, импорт и проверки остаются без удаления.

  Новое поле state.menuColor сохраняется обычным commit().
  Исходный validateState допускает дополнительные поля,
  поэтому формат существующих сохранений не ломается.
*/

(function installInfoWalletAppearance() {
  const palettes = {

    gray: {

    red: {

        on: "#36202b",

      light: {

    yellow: {
      name: "Жёлтый",
      dark: {
        accent: "#ead19c",
        start: "#efdab0",
        end: "#c7a16a",
        rgb: "234,209,156",
        on: "#342b22",
        balanceStart: "#6d583d",
        balanceEnd: "#362e2a",
        balanceText: "#f0e0c6"
      },
      light: {
        accent: "#99773b",
        start: "#d3b475",
        end: "#ad8a4c",
        rgb: "153,119,59",
        on: "#30271d",
        balanceStart: "#8b734d",
        balanceEnd: "#463c30",
        balanceText: "#f7e9ce"
      }
    },

    green: {
      name: "Зелёный",
      dark: {
        accent: "#9bd2bc",
        start: "#afdcc8",
        end: "#72ae98",
        rgb: "155,210,188",
        on: "#20332c",
        balanceStart: "#355d55",
        balanceEnd: "#203331",
        balanceText: "#d0e9df"
      },
      light: {
        accent: "#4b8a72",
        start: "#88bba5",
        end: "#5b947c",
        rgb: "75,138,114",
        on: "#ffffff",
        balanceStart: "#527f6f",
        balanceEnd: "#2b443c",
        balanceText: "#dbefe5"
      }
    }
  };

  function selectedColor() {
    const value = state.menuColor;

    return Object.prototype.hasOwnProperty.call(palettes, value)
      ? value
      : "purple";
  }

  function currentPalette() {
    const variant = state.theme === "light" ? "light" : "dark";
    return palettes[selectedColor()][variant];
  }

  function applyAppearance() {
    const color = selectedColor();
    const p = currentPalette();

    /*
      Переменные задаются на body, чтобы они имели приоритет
      над первоначальными body.light и наследовались интерфейсом.
    */
    const variables = {
      "--iw-accent": p.accent,
      "--iw-accent-start": p.start,
      "--iw-accent-end": p.end,
      "--iw-rgb": p.rgb,
      "--iw-on-accent": p.on,
      "--iw-balance-start": p.balanceStart,
      "--iw-balance-end": p.balanceEnd,
      "--iw-balance-text": p.balanceText,

      "--purple": p.accent,
      "--accent": p.end,

      "--line": "rgba(" + p.rgb + ", .15)"
    };

    Object.entries(variables).forEach(function(entry) {
      document.body.style.setProperty(entry[0], entry[1]);
    });

    document.body.dataset.menuColor = color;

    /*
      В исходной функции chart() цвета записаны прямо в SVG.
      Меняем только акцент графика, не затрагивая данные,
      предупреждения и золотую линию защищённых средств.
    */
    document.querySelectorAll("#app svg.chart").forEach(function(svg) {
      svg.querySelectorAll("stop").forEach(function(stop) {
        if (stop.getAttribute("stop-color") === "#a88aff") {
          stop.setAttribute("stop-color", p.accent);
        }
      });

      svg.querySelectorAll("path[stroke]").forEach(function(path) {
        if (path.getAttribute("stroke") === "#ad8bff") {
          path.setAttribute("stroke", p.accent);
        }
      });

      svg.querySelectorAll("circle[fill]").forEach(function(circle) {
        if (circle.getAttribute("fill") === "#d4b4ff") {
          circle.setAttribute("fill", p.start);
        }
      });
    });

    /*
      Отдельная карточка симулятора на главной имеет inline-фон.
      Добавляем класс, не меняя её содержимое и кнопки.
    */
    document.querySelectorAll("#app .card").forEach(function(card) {
      const openSimulator = card.querySelector(
        'button[onclick="go(\'simulator\')"]'
      );

      if (
        page === "home" &&
        openSimulator &&
        card.querySelector(".goal-icon")
      ) {
        card.classList.add("iw-purchase-card");
      }
    });
  }

  function colorSettingsMarkup() {
    const selected = selectedColor();
    const variant = state.theme === "light" ? "light" : "dark";

    const buttons = Object.entries(palettes).map(function(entry) {
      const id = entry[0];
      const item = entry[1];
      const p = item[variant];
      const active = id === selected;

      return `
        <button
          type="button"
          class="iw-color-choice"
          data-iw-color="${id}"
          aria-pressed="${active ? "true" : "false"}"
          aria-label="${esc(item.name)} цвет интерфейса"
          style="
            --swatch-start:${p.start};
            --swatch-end:${p.end};
          "
        >
          <span class="iw-color-preview" aria-hidden="true"></span>
          <span>${esc(item.name)}</span>
          ${active
            ? '<span class="iw-color-check" aria-hidden="true">✓</span>'
            : ""}
        </button>
      `;
    }).join("");

    return `
      <section
        class="card iw-color-settings"
        id="iwColorSettings"
        aria-labelledby="iwColorTitle"
      >
        <div class="iw-color-heading">
          <h2 id="iwColorTitle">Цвет интерфейса</h2>
          <span class="badge">${esc(palettes[selected].name)}</span>
        </div>

        <p class="iw-color-description">
          Мягкие оттенки меню, кнопок и акцентов.
          Работают в тёмной и светлой теме.
        </p>

        <div
          class="iw-color-grid"
          role="group"
          aria-label="Выберите цвет интерфейса"
        >
          ${buttons}
        </div>

        <div class="iw-theme-note">
          ${icon("shield")}
          <span>Выбор сохраняется на этом устройстве.</span>
        </div>
      </section>
    `;
  }

  function injectColorSettings() {
    if (page !== "settings") return;
    if (document.getElementById("iwColorSettings")) return;

    const firstColumn = document.querySelector(
      "#app .page > .grid.two > .stack"
    );

    if (!firstColumn) return;

    /*
      Вставляем после профиля, сохраняя все остальные
      первоначальные разделы настроек.
    */
    const profileCard = firstColumn.firstElementChild;

    if (profileCard) {
      profileCard.insertAdjacentHTML(
        "afterend",
        colorSettingsMarkup()
      );
    } else {
      firstColumn.insertAdjacentHTML(
        "afterbegin",
        colorSettingsMarkup()
      );
    }
  }

  /*
    Расширяем существующий render, а не заменяем представления.
    Поэтому новые цвета применяются после навигации, импорта,
    переключения темы и обновления из другой вкладки.
  */
  const originalRender = render;

  render = function renderWithAppearance() {
    originalRender();
    applyAppearance();
    injectColorSettings();
  };

  document.addEventListener("click", function(event) {
    if (!(event.target instanceof Element)) return;

    const button = event.target.closest("[data-iw-color]");
    if (!button) return;

    const id = button.dataset.iwColor;

    if (!Object.prototype.hasOwnProperty.call(palettes, id)) return;
    if (id === selectedColor()) return;

    const scrollPosition = window.scrollY;

    try {
      transact(function(next) {
        next.menuColor = id;
      }, "Цвет интерфейса: " + palettes[id].name);

      /*
        Исходный commit перерисовывает приложение.
        Возвращаем фокус на выбранную кнопку без прокрутки.
      */
      const selectedButton = document.querySelector(
        '[data-iw-color="' + id + '"]'
      );

      if (selectedButton) {
        selectedButton.focus({ preventScroll: true });
      }

      window.scrollTo({
        top: scrollPosition,
        behavior: "instant"
      });
    } catch (error) {
      toast(error.message);
    }
  });

  /* Применяем дополнение к уже открытой странице. */
  render();
})();
</script>

</body>
</html>
